<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- Чёрный круг на проде, серый в локальной версии: %MODE% подставляет Vite (production / development). -->
    <link rel="icon" type="image/svg+xml" href="/favicon-%MODE%.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <!-- Трекер можно добавить на домашний экран телефона: он откроется как приложение,
         со своей иконкой и без панелей браузера. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Трекер" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Тема ставится до первой отрисовки, чтобы страница не мигала светлой перед тёмной. -->
    <script>
      try {
        var saved = localStorage.getItem('tracker.theme')
        // Пока тему не выбирали в Профиле, берётся системная.
        if (saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.dataset.theme = 'dark'
        }
        // Акцентный цвет, выбранный в Профиле. Без выбора остаётся лаймовый.
        var accent = localStorage.getItem('tracker.accent')
        if (accent) document.documentElement.dataset.accent = accent
        // Заставка при открытии: у вошедшего она его акцентного цвета, у гостя лаймовая, как
        // лендинг и экран входа. Вошёл ли человек, видно по сохранённому входу Supabase.
        // Демо и страницы разработки это уже сам трекер: там цвет выбранный.
        var signedIn = false
        for (var index = 0; index < localStorage.length; index++) {
          if (/^sb-.+-auth-token$/.test(localStorage.key(index))) signedIn = true
        }
        if (!signedIn && !/^\/(demo|dev)(\/|$)/.test(location.pathname)) {
          document.documentElement.dataset.splash = 'lime'
        }
      } catch (e) {}
    </script>
    <!-- Заставка при открытии: маскот по центру, пока грузится код и данные. Стили лежат здесь,
         а не в общих: её должно быть видно до того, как загрузится всё остальное. Цвета повторяют
         токены, тема уже стоит на <html>. Маскот акцентного цвета, у гостя всегда лаймовый. Убирает её
         приложение, когда готово (src/lib/splash.ts). -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        --splash-accent: #c6f432;
        transition: opacity 250ms ease-out;
      }
      [data-theme='dark'] #splash {
        background: #1c1c1c;
      }
      [data-accent='pink'] #splash {
        --splash-accent: #ff7ec8;
      }
      [data-accent='sky'] #splash {
        --splash-accent: #6ccbff;
      }
      [data-accent='yellow'] #splash {
        --splash-accent: #ffd534;
      }
      [data-accent='violet'] #splash {
        --splash-accent: #b9a6ff;
      }
      /* Гость: заставка лаймовая, какой бы цвет ни был выбран в этом браузере. */
      [data-splash='lime'] #splash {
        --splash-accent: #c6f432;
      }
      #splash.splash-out {
        opacity: 0;
        pointer-events: none;
      }
      /* Маскот: круг акцентного цвета с двумя глазами, пропорции как у Mascot. Виден сразу,
         с первого кадра: заставка стоит не меньше полутора секунд (src/lib/splash.ts). */
      .splash-mascot {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        width: 72px;
        height: 72px;
        padding-bottom: 6px;
        box-sizing: border-box;
        border-radius: 50%;
        background: var(--splash-accent);
        animation:
          splash-in 300ms ease-out backwards,
          splash-hop 1.2s ease-in-out 300ms infinite;
      }
      .splash-mascot i {
        width: 9px;
        height: 16px;
        border-radius: 9px;
        background: #171717;
        animation: splash-blink 2.4s infinite;
      }
      @keyframes splash-in {
        from {
          opacity: 0;
          transform: scale(0.8);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      /* Маскот мягко подпрыгивает: видно, что трекер не завис. */
      @keyframes splash-hop {
        0%,
        100% {
          translate: 0 0;
        }
        50% {
          translate: 0 -10px;
        }
      }
      @keyframes splash-blink {
        0%,
        90%,
        100% {
          transform: scaleY(1);
        }
        95% {
          transform: scaleY(0.1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-mascot,
        .splash-mascot i {
          animation: none;
        }
        #splash {
          transition: none;
        }
      }
    </style>
    <title>Трекер</title>
    <meta name="description" content="Личный трекер недель, задач, привычек и финансов" />

    <!-- Предпросмотр ссылки в мессенджерах и соцсетях -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Трекер" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:url" content="https://nstvlsncv-tracker.vercel.app/" />
    <meta property="og:title" content="Трекер" />
    <meta property="og:description" content="Личный трекер недель, задач, привычек и финансов" />
    <meta property="og:image" content="https://nstvlsncv-tracker.vercel.app/og.png?v=5" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="splash-mascot"><i></i><i></i></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
