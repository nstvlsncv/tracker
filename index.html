<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- Чёрный круг на проде, серый в локальной версии: %MODE% подставляет Vite (production / development). -->
    <link rel="icon" type="image/svg+xml" href="/favicon-%MODE%.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <!-- Трекер можно добавить на домашний экран телефона: он откроется как приложение,
         со своей иконкой и без панелей браузера. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Трекер" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Тема ставится до первой отрисовки, чтобы страница не мигала светлой перед тёмной. -->
    <script>
      try {
        if (localStorage.getItem('tracker.theme') === 'dark') document.documentElement.dataset.theme = 'dark'
      } catch (e) {}
    </script>
    <title>Трекер</title>
    <meta name="description" content="Личный трекер недель, задач, целей и привычек" />

    <!-- Предпросмотр ссылки в мессенджерах и соцсетях -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Трекер" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:url" content="https://nstvlsncv-tracker.vercel.app/" />
    <meta property="og:title" content="Трекер" />
    <meta property="og:description" content="Личный трекер недель, задач, целей и привычек" />
    <meta property="og:image" content="https://nstvlsncv-tracker.vercel.app/og.png?v=3" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
